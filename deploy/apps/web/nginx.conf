server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — cache aggressively
    location /_next/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # PWA manifest — correct MIME type so Android/iOS treat it as installable
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    # Service worker — must revalidate so updates ship promptly (never long-cache)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # SPA routing: try exact file, then .html, then fallback to index
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
