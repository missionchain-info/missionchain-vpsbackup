<!-- how claim works -->
<rect x="920" y="374" width="360" height="90" rx="10" fill="#161d33" stroke="#3aa0e0" stroke-dasharray="4 3"/>
<text x="1100" y="394" text-anchor="middle" class="hd" font-size="11">CLAIM MODEL (GV · Weekly · Monthly · Lucky)</text>
<text x="1100" y="414" text-anchor="middle" class="s" font-size="10">USDT sits IN each pool contract. System computes off-chain →</text>
<text x="1100" y="429" text-anchor="middle" class="s" font-size="10">credit(user, amount) writes claimable on-chain (CREDITOR role) →</text>
<text x="1100" y="444" text-anchor="middle" fill="#8FD3C4" font-size="10">user calls claim() → USDT leaves pool → user wallet.</text>
<text x="1100" y="458" text-anchor="middle" class="s" font-size="9">Balances transparent: claimable(user) readable on-chain.</text>

